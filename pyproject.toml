[project]
name = "evalkit"
version = "0.1.0"
description = "Reproducible LLM evaluation harness: dataset versioning, judge calibration, cost/latency tracking, CI gates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Paulo Moura Martins", email = "contact@paulomoura.dev"}]
dependencies = []

[project.scripts]
evalkit = "evalkit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]
